<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .status {
            font-size: 14px;
            opacity: 0.9;
        }

        .status.connected {
            color: #4ade80;
        }

        .status.disconnected {
            color: #fb7185;
        }

        #log {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.system {
            background: #e0e7ff;
            color: #4338ca;
            font-style: italic;
            text-align: center;
        }

        .input-area {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        #msg {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #msg:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            margin-left: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar styling */
        #log::-webkit-scrollbar {
            width: 8px;
        }

        #log::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        #log::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        #log::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Go Chat Application</h1>
            <div class="status" id="status">Connecting...</div>
        </div>
        <div id="log"></div>
        <div class="input-area">
            <input type="text" id="msg" placeholder="Type your message..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const log = document.getElementById("log");
        const msg = document.getElementById("msg");
        const sendBtn = document.getElementById("sendBtn");
        const status = document.getElementById("status");

        let conn;

        function appendLog(item, isSystem = false) {
            const div = document.createElement("div");
            div.className = isSystem ? "message system" : "message";
            div.textContent = item;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus(connected) {
            if (connected) {
                status.textContent = "Connected ✓";
                status.className = "status connected";
                sendBtn.disabled = false;
            } else {
                status.textContent = "Disconnected ✗";
                status.className = "status disconnected";
                sendBtn.disabled = true;
            }
        }

        function connect() {
            if (window["WebSocket"]) {
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                conn = new WebSocket(protocol + "//" + window.location.host + "/ws");
                
                conn.onopen = function(evt) {
                    appendLog("Connected to chat server", true);
                    updateStatus(true);
                };

                conn.onclose = function(evt) {
                    appendLog("Connection closed", true);
                    updateStatus(false);
                    // Attempt to reconnect after 3 seconds
                    setTimeout(connect, 3000);
                };

                conn.onmessage = function(evt) {
                    const messages = evt.data.split('\n');
                    for (let i = 0; i < messages.length; i++) {
                        if (messages[i]) {
                            appendLog(messages[i]);
                        }
                    }
                };

                conn.onerror = function(evt) {
                    appendLog("Connection error", true);
                    updateStatus(false);
                };
            } else {
                appendLog("Your browser does not support WebSockets", true);
            }
        }

        function sendMessage() {
            if (!conn) {
                return false;
            }
            if (!msg.value) {
                return false;
            }
            conn.send(msg.value);
            msg.value = "";
            return false;
        }

        sendBtn.addEventListener("click", sendMessage);

        msg.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        // Connect on page load
        connect();
    </script>
</body>
</html>
